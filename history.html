<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event History</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #061a35;
            color: white;
            min-height: 100vh;
        }

        nav {
            height: 80px;
            background: #06152b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 70px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #20a4ff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
        }

        nav a:hover {
            color: #20a4ff;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #b7c7dc;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .search {
            display: block;
            width: 65%;
            margin: 0 auto 40px;
            padding: 18px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.15);
            background: #193554;
            color: white;
            font-size: 17px;
            outline: none;
        }

        .search::placeholder {
            color: #aab9ca;
        }

        #historyContainer {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background: #123963;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            padding: 30px;
            position: relative;
        }

        .event-number {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .event-text {
            color: #d8e5f5;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 15px;
            padding-right: 180px;
        }

        .info {
            color: #aebfd3;
            margin: 8px 0;
        }

        .result {
            position: absolute;
            right: 30px;
            top: 85px;
            padding: 15px 35px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .real {
            color: #20e890;
            border: 1px solid #20e890;
            background: rgba(32,232,144,0.08);
        }

        .fake {
            color: #ff5555;
            border: 1px solid #ff5555;
            background: rgba(255,85,85,0.08);
        }

        .no-result {
            color: #20a4ff;
            border: 1px solid #20a4ff;
        }

        .uncertain {
            color: #ffaa00;
            border: 1px solid #ffaa00;
        }

        .report-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 22px;
            background: #159bea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 50px;
            color: #aebfd3;
            font-size: 20px;
        }

        @media (max-width: 700px) {

            nav {
                height: auto;
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
                font-size: 14px;
            }

            h1 {
                font-size: 35px;
            }

            .search {
                width: 100%;
            }

            .event-text {
                padding-right: 0;
            }

            .result {
                position: static;
                display: inline-block;
                margin-top: 15px;
            }
        }

    </style>

</head>

<body>

    <nav>

        <div class="logo">
            History <span>Event Analysis</span>
        </div>

        <div>

            <a href="/">Home</a>

            <a href="/check">Check Event</a>

            <a href="/history">History</a>

            <a href="/report">Report</a>

            <a href="/logout">Logout</a>

        </div>

    </nav>


    <div class="container">

        <h1>Event History</h1>

        <p class="subtitle">
            View all your previously analyzed historical events
        </p>


        <input
            type="text"
            id="searchBox"
            class="search"
            placeholder="Search historical event..."
            onkeyup="searchHistory()"
        >


        <div id="historyContainer"></div>

    </div>


<script>

let historyList = [];


/* LOAD HISTORY */

async function loadHistory() {

    const container =
        document.getElementById("historyContainer");

    container.innerHTML =
        "<div class='empty'>Loading history...</div>";


    try {

        const response =
            await fetch("/history-data");


        if (!response.ok) {

            throw new Error("Unable to load history");

        }


        historyList =
            await response.json();


        displayHistory(historyList);

    }

    catch (error) {

        console.error(error);

        container.innerHTML =
            "<div class='empty'>Unable to load history.</div>";

    }

}


/* DISPLAY HISTORY */

function displayHistory(data) {

    const container =
        document.getElementById("historyContainer");


    if (!data || data.length === 0) {

        container.innerHTML =
            "<div class='empty'>No history events found.</div>";

        return;

    }


    container.innerHTML = "";


    data.slice().reverse().forEach(
        function(item, index) {


            const eventText =
                item.news ||
                item.text ||
                item.event ||
                "No event text";


            const result =
                String(item.result || "NO RESULT")
                .toUpperCase();


            const rawConf = item.confidence;
            const confidence =
                rawConf !== undefined && rawConf !== null
                    ? (String(rawConf).includes("%") ? rawConf : rawConf + "%")
                    : "0%";


            const date =
                item.date || "Date not available";


            let resultClass =
                "no-result";


            if (result.includes("REAL")) {

                resultClass = "real";

            }

            else if (result.includes("FAKE")) {

                resultClass = "fake";

            }

            else if (result.includes("UNCERTAIN")) {

                resultClass = "uncertain";

            }


            const card =
                document.createElement("div");


            card.className = "card";


            card.innerHTML = `

                <div class="event-number">
                    Event ${data.length - index}
                </div>

                <div class="event-text">
                    ${escapeHtml(eventText)}
                </div>

                <div class="info">
                    📅 ${escapeHtml(date)}
                </div>

                <div class="info">
                    🤖 Confidence: ${escapeHtml(String(confidence))}
                </div>

                <div class="result ${resultClass}">
                    ${escapeHtml(result)}
                </div>

                <a
                    href="/report"
                    class="report-btn"
                >
                    📊 View Report
                </a>

            `;


            container.appendChild(card);

        }
    );

}


/* SEARCH */

function searchHistory() {

    const search =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        historyList.filter(
            function(item) {

                const text =
                    item.news ||
                    item.text ||
                    item.event ||
                    "";

                return text
                    .toLowerCase()
                    .includes(search);

            }
        );


    displayHistory(filtered);

}


/* SAFE HTML */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* START */

loadHistory();

</script>

</body>

</html>
