<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event History - History Event Analysis</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;
            background:
                radial-gradient(circle at 15% 20%, rgba(0,140,255,0.25), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(0,220,255,0.15), transparent 30%),
                linear-gradient(135deg, #020b1c, #061b3a, #082b57);
            overflow-x: hidden;
        }

        /* BACKGROUND */

        .orb {
            position: fixed;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.18;
            z-index: 0;
            animation: orbMove 8s infinite alternate ease-in-out;
        }

        .orb1 {
            background: #008cff;
            top: 10%;
            left: -80px;
        }

        .orb2 {
            background: #00d9ff;
            bottom: -80px;
            right: -50px;
            animation-delay: 2s;
        }

        @keyframes orbMove {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(100px, 70px);
            }
        }

        /* NAVBAR */

        nav {
            height: 80px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(2,15,35,0.75);
            border-bottom: 1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(15px);

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #20a4ff;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #dcecff;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #20a4ff;
            transform: translateY(-2px);
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 60px auto;
            position: relative;
            z-index: 2;
        }

        /* HEADER */

        .page-header {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeDown 0.8s ease;
        }

        .history-icon {
            width: 75px;
            height: 75px;
            margin: auto;
            margin-bottom: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #087cff,
                #00c6ff
            );

            font-size: 35px;

            box-shadow:
                0 0 35px rgba(0,150,255,0.45);

            animation: floatIcon 3s infinite ease-in-out;
        }

        @keyframes floatIcon {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }

        .page-header h1 {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .page-header p {
            color: #b9cde2;
            font-size: 17px;
        }

        /* SEARCH */

        .search-area {
            display: flex;
            justify-content: center;
            margin-bottom: 35px;
        }

        .search-box {
            width: 600px;
            max-width: 100%;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 17px 22px 17px 50px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.15);

            outline: none;

            background: rgba(255,255,255,0.08);

            color: white;

            font-size: 16px;

            backdrop-filter: blur(12px);

            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #168cff;

            box-shadow:
                0 0 25px rgba(0,140,255,0.25);
        }

        .search-box input::placeholder {
            color: #8fa6bd;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 15px;
            font-size: 20px;
        }

        /* HISTORY LIST */

        .history-list {
            display: grid;
            gap: 20px;
        }

        /* CARD */

        .history-card {
            position: relative;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 25px;

            padding: 25px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(20,75,135,0.60),
                    rgba(8,35,75,0.65)
                );

            border: 1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(15px);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);

            animation: cardAppear 0.7s ease;

            transition: 0.35s;
        }

        .history-card:hover {
            transform: translateY(-7px) scale(1.01);

            border-color: rgba(32,164,255,0.5);

            box-shadow:
                0 20px 45px rgba(0,140,255,0.20);
        }

        .event-info {
            flex: 1;
        }

        .event-info h3 {
            font-size: 21px;
            margin-bottom: 10px;
            color: white;
        }

        .event-info p {
            color: #c1d3e7;
            line-height: 1.6;
            font-size: 15px;
        }

        .date {
            margin-top: 12px;
            color: #819bb7;
            font-size: 13px;
        }

        .confidence {
            margin-top: 7px;
            color: #8eb9df;
            font-size: 13px;
        }

        /* RESULT */

        .result {
            min-width: 110px;

            text-align: center;

            padding: 13px 18px;

            border-radius: 12px;

            font-weight: bold;

            font-size: 15px;

            letter-spacing: 1px;
        }

        .real {
            color: #20e890;

            background: rgba(32,232,144,0.10);

            border: 1px solid rgba(32,232,144,0.35);

            box-shadow:
                0 0 20px rgba(32,232,144,0.08);
        }

        .fake {
            color: #ff5b5b;

            background: rgba(255,77,77,0.10);

            border: 1px solid rgba(255,77,77,0.35);

            box-shadow:
                0 0 20px rgba(255,77,77,0.08);
        }

        /* BUTTONS */

        .card-buttons {
            margin-top: 18px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .view-btn,
        .report-btn {

            display: inline-block;

            padding: 9px 15px;

            border-radius: 8px;

            color: white;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            transition: 0.3s;
        }

        .view-btn {
            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);
        }

        .report-btn {
            background: linear-gradient(
                90deg,
                #087cff,
                #00aaff
            );
        }

        .view-btn:hover,
        .report-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0,140,255,0.25);
        }

        /* EMPTY */

        .empty {
            display: none;

            text-align: center;

            padding: 60px 20px;

            color: #9db2c8;

            font-size: 17px;
        }

        /* ANIMATION */

        @keyframes fadeDown {

            from {
                opacity: 0;
                transform: translateY(-35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* MOBILE */

        @media (max-width: 800px) {

            nav {
                height: auto;
                padding: 18px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links a {
                font-size: 13px;
            }

            .container {
                width: 92%;
                margin: 40px auto;
            }

            .page-header h1 {
                font-size: 36px;
            }

            .history-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .result {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            History <span>Event Analysis</span>
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/check">Check Event</a>

            <a href="/history">History</a>

            <a href="/report">Report</a>

            <a href="/logout">Logout</a>

        </div>

    </nav>


    <!-- MAIN -->

    <div class="container">


        <!-- HEADER -->

        <div class="page-header">

            <div class="history-icon">
                📜
            </div>

            <h1>
                Event History
            </h1>

            <p>
                View all your previously analyzed historical events
            </p>

        </div>


        <!-- SEARCH -->

        <div class="search-area">

            <div class="search-box">

                <div class="search-icon">
                    🔍
                </div>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search historical event..."
                    onkeyup="searchEvents()"
                >

            </div>

        </div>


        <!-- HISTORY -->

        <div
            class="history-list"
            id="historyList">
        </div>


        <!-- EMPTY -->

        <div
            class="empty"
            id="emptyMessage">

            📭 No history events found.

        </div>


    </div>


<script>


/* =====================================================
   LOAD HISTORY FROM FLASK
===================================================== */

async function loadHistory() {

    const historyList =
        document.getElementById("historyList");

    const emptyMessage =
        document.getElementById("emptyMessage");


    try {

        const response =
            await fetch("/history-data");


        const history =
            await response.json();


        historyList.innerHTML = "";


        if (!history || history.length === 0) {

            emptyMessage.style.display =
                "block";

            return;

        }


        emptyMessage.style.display =
            "none";


        history.forEach(function(item, index) {


            const card =
                document.createElement("div");


            card.className =
                "history-card";


            const resultClass =
                item.result === "REAL"
                    ? "real"
                    : "fake";


            card.innerHTML = `

                <div class="event-info">

                    <h3>
                        Event ${index + 1}
                    </h3>

                    <p>
                        ${escapeHtml(item.event || item.news || "")}
                    </p>

                    <div class="date">
                        📅 ${escapeHtml(item.date || "")}
                    </div>

                    <div class="confidence">
                        🤖 Confidence:
                        ${escapeHtml(item.confidence || "N/A")}
                    </div>

                    <div class="card-buttons">

                        <a
                            href="/report"
                            class="report-btn">

                            📊 View Report

                        </a>

                    </div>

                </div>


                <div class="result ${resultClass}">

                    ${escapeHtml(item.result)}

                </div>

            `;


            historyList.appendChild(card);

        });


    }

    catch (error) {

        console.log(
            "History loading error:",
            error
        );

        emptyMessage.style.display =
            "block";

    }

}


/* =====================================================
   SEARCH
===================================================== */

function searchEvents() {

    const input =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const cards =
        document.querySelectorAll(
            ".history-card"
        );


    let found = 0;


    cards.forEach(function(card) {

        const text =
            card.innerText.toLowerCase();


        if (text.includes(input)) {

            card.style.display =
                "flex";

            found++;

        }

        else {

            card.style.display =
                "none";

        }

    });


    const empty =
        document.getElementById(
            "emptyMessage"
        );


    if (found === 0) {

        empty.style.display =
            "block";

    }

    else {

        empty.style.display =
            "none";

    }

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================================
   START
===================================================== */

loadHistory();


</script>


</body>

</html>
