<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Event - History Event Analysis</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #06152e, #0b2c5c, #06234a);
            color: white;
            overflow-x: hidden;
        }

        /* BACKGROUND GLOW */

        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            background: #008cff;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.22;
            top: 10%;
            left: 5%;
            animation: moveGlow 6s infinite alternate;
            z-index: 0;
        }

        .glow2 {
            position: fixed;
            width: 300px;
            height: 300px;
            background: #00d9ff;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.18;
            bottom: 5%;
            right: 5%;
            animation: moveGlow2 7s infinite alternate;
            z-index: 0;
        }

        @keyframes moveGlow {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(120px, 80px);
            }
        }

        @keyframes moveGlow2 {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-100px, -70px);
            }
        }

        /* NAVBAR */

        nav {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            background: rgba(4,20,45,0.75);
            position: relative;
            z-index: 5;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #20a4ff;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 850px;
            margin: 60px auto;
            padding: 45px;
            text-align: center;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 22px;
            backdrop-filter: blur(18px);

            box-shadow: 0 25px 70px rgba(0,0,0,0.35);

            position: relative;
            z-index: 2;

            animation: appear 1s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* ICON */

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #168cff,
                #00c6ff
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;

            box-shadow: 0 0 30px rgba(0,160,255,0.45);

            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }

        h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #c4d6ea;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* TEXTAREA */

        textarea {
            width: 100%;
            height: 190px;

            padding: 18px;

            border-radius: 13px;

            border: 1px solid rgba(255,255,255,0.18);

            outline: none;

            resize: vertical;

            background: rgba(255,255,255,0.10);

            color: white;

            font-size: 16px;

            font-family: Arial, sans-serif;

            transition: 0.3s;
        }

        textarea::placeholder {
            color: #aebed0;
        }

        textarea:focus {
            border-color: #20a4ff;

            box-shadow:
                0 0 20px rgba(32,164,255,0.25);
        }

        /* CHECK BUTTON */

        .check-btn {
            margin-top: 22px;

            padding: 15px 38px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #087cff,
                #00b7ff
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .check-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 30px rgba(0,140,255,0.4);
        }

        /* RESULT */

        #result {
            margin-top: 30px;

            font-size: 30px;

            font-weight: bold;

            min-height: 35px;
        }

        #reason {
            margin-top: 12px;

            color: #c8d9ea;

            font-size: 16px;

            line-height: 1.6;
        }

        /* LINKS */

        .buttons {
            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-block;

            padding: 13px 24px;

            border-radius: 9px;

            color: white;

            text-decoration: none;

            font-weight: bold;

            background: rgba(255,255,255,0.10);

            border: 1px solid rgba(255,255,255,0.15);

            transition: 0.3s;
        }

        .action-btn:hover {
            transform: translateY(-3px);

            background: rgba(20,140,255,0.25);

            border-color: #168cff;
        }

        .logout {
            background: rgba(255,80,80,0.15);
        }

        .logout:hover {
            border-color: #ff5555;
            background: rgba(255,80,80,0.25);
        }

        /* MOBILE */

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }

            .logo {
                font-size: 18px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .container {
                width: 92%;
                padding: 30px 20px;
                margin: 35px auto;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 15px;
            }

            textarea {
                height: 160px;
            }

        }

    </style>

</head>


<body>

    <div class="glow"></div>
    <div class="glow2"></div>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            History Event Analysis
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/history">
                History
            </a>

            <a href="/report">
                Report
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- MAIN -->

    <div class="container">

        <div class="icon">
            🔍
        </div>


        <h1>
            Analyze History Event
        </h1>


        <p class="subtitle">
            Enter a historical event below to check whether
            it is <b>Real</b> or <b>Fake</b> using
            Machine Learning.
        </p>


        <textarea
            id="news"
            placeholder="Enter historical event here...">
        </textarea>


        <br>


        <button
            class="check-btn"
            onclick="checkNews()">

            Check Event

        </button>


        <div id="result"></div>

        <div id="reason"></div>


        <div class="buttons">

            <a
                href="/history"
                class="action-btn">

                📜 View History

            </a>


            <a
                href="/report"
                class="action-btn">

                📊 View Report

            </a>

        </div>

    </div>


<script>

async function checkNews() {

    const news =
        document
        .getElementById("news")
        .value
        .trim();


    const result =
        document.getElementById("result");

    const reason =
        document.getElementById("reason");


    if (news === "") {

        result.innerText =
            "PLEASE ENTER A HISTORY EVENT";

        result.style.color =
            "#ff6b6b";

        reason.innerText =
            "Please enter a historical event before checking.";

        return;

    }


    result.innerText =
        "ANALYZING...";

    result.style.color =
        "#20a4ff";

    reason.innerText =
        "Machine Learning model is analyzing the event...";


    try {

        const response =
            await fetch("/predict", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    news: news
                })

            });


        const data =
            await response.json();


        result.innerText =
            data.result;


        reason.innerText =
            data.reason;


        if (data.result === "REAL") {

            result.style.color =
                "#20e890";

        }

        else if (data.result === "FAKE") {

            result.style.color =
                "#ff5555";

        }

        else {

            result.style.color =
                "#20a4ff";

        }


        /* SAVE LOCAL HISTORY */

        const history =
            JSON.parse(
                localStorage.getItem("newsHistory")
            ) || [];


        history.push({

            news: news,

            result: data.result,

            date: new Date().toLocaleString()

        });


        localStorage.setItem(
            "newsHistory",
            JSON.stringify(history)
        );


    }

    catch (error) {

        result.innerText =
            "ERROR";

        result.style.color =
            "#ff5555";

        reason.innerText =
            "Unable to connect to the server.";

    }

}

</script>


</body>

</html>
